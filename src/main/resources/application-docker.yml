# Application Configuration
spring:
  application:
    name: Nebula

  # Database Configuration - Docker Compose version
  datasource:
    url: jdbc:postgresql://postgres:5432/productservice
    username: ${SPRING_DATASOURCE_USERNAME:productservice}
    password: ${SPRING_DATASOURCE_PASSWORD:qwerty}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # Kafka Configuration - Docker Compose version
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: nebula-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    admin:
      properties:
        bootstrap.servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# Server Configuration
server:
  port: 8081

# FakeStore API
fakestore:
  api:
    url: https://fakestoreapi.com/products/{id}