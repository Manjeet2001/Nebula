spring.application.name=Nebula
server.port=8081
fakestore.api.url=https://fakestoreapi.com/products/{id}

# Database Configuration - Docker version
spring.datasource.url=jdbc:postgresql://postgres:5432/productservice
spring.datasource.username=productservice
spring.datasource.password=qwerty
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Kafka Configuration - Docker version
spring.kafka.consumer.group-id=nebula-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer